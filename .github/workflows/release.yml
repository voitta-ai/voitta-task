name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '**.md'

permissions:
  contents: read

env:
  VERSION_FILE: engine/Cargo.toml
  LOCK_FILE: engine/Cargo.lock
  CRATE_NAME: voitta-task-engine

jobs:
  version-bumped:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version must advance
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"

          new=$(python3 -c "import tomllib; print(tomllib.load(open('$VERSION_FILE','rb'))['package']['version'])")
          new_lock=$(python3 -c "import tomllib; d=tomllib.load(open('$LOCK_FILE','rb')); print(next(p['version'] for p in d['package'] if p['name']=='$CRATE_NAME'))")
          if [ "$new" != "$new_lock" ]; then
            echo "::error::$LOCK_FILE has $CRATE_NAME at $new_lock but $VERSION_FILE says $new - run 'cargo build' in engine/ to sync the lockfile."
            exit 1
          fi

          # Bootstrap: base branch predates this version file entirely.
          if git cat-file -e "FETCH_HEAD:$VERSION_FILE" 2>/dev/null; then
            git show "FETCH_HEAD:$VERSION_FILE" > /tmp/base-cargo.toml
            old=$(python3 -c "import tomllib; print(tomllib.load(open('/tmp/base-cargo.toml','rb'))['package']['version'])")
          else
            old=""
          fi
          if [ -z "$old" ]; then
            echo "Bootstrap: no $VERSION_FILE on $BASE; accepting $new."
            exit 0
          fi

          if [ "$old" = "$new" ]; then
            echo "::error::$VERSION_FILE version is still $old - bump it."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | head -1)" != "$old" ]; then
            echo "::error::$new does not advance past $old."
            exit 1
          fi
          echo "$old -> $new"

  tag-and-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('$VERSION_FILE','rb'))['package']['version'])")

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            tag_sha=$(git rev-parse "refs/tags/v$version^{commit}")
            if [ "$tag_sha" = "$GITHUB_SHA" ]; then
              echo "v$version is tagged on this commit."
            else
              echo "v$version already exists on $tag_sha, not this push ($GITHUB_SHA); this push did not bump the version."
            fi
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "Release for v$version already exists; nothing to do."
            else
              echo "No release for v$version yet; creating it at the existing tag."
              gh release create "v$version" \
                --title "v$version" \
                --generate-notes
            fi
            exit 0
          fi

          gh release create "v$version" \
            --title "v$version" \
            --generate-notes \
            --target "$GITHUB_SHA"
